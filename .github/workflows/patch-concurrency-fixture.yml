name: Patch concurrency fixture

on:
  push:
    branches:
      - fix/alphamec-production-ready-completion

permissions:
  contents: write

jobs:
  patch-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/alphamec-production-ready-completion
      - name: Patch real Postgres fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_conversion_unique_concurrency.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''    from database.models import (
                  CommercialOutcomeRow,
                  Lead,
                  LeadActivity,
                  LeadStatus,
                  Organization,
              )'''
          new_import = '''    from database.models import (
                  CommercialOutcomeRow,
                  Lead,
                  LeadActivity,
                  LeadStatus,
                  Organization,
                  OrganizationMember,
                  OrganizationRole,
                  SalesRole,
                  User,
              )'''
          if old_import not in text:
              raise SystemExit('Expected fixture import block not found')
          text = text.replace(old_import, new_import, 1)

          old_setup = '''    org = Organization(
                  id=uuid.uuid4(),
                  name=f"Conversao Concorrente {sufixo}",
                  slug=f"conversao-concorrente-{sufixo}",
              )
              sessao.add(org)
              sessao.flush()
              lead = Lead('''
          new_setup = '''    org = Organization(
                  id=uuid.uuid4(),
                  name=f"Conversao Concorrente {sufixo}",
                  slug=f"conversao-concorrente-{sufixo}",
              )
              user = User(
                  id=uuid.uuid4(),
                  email=f"concorrencia-{sufixo}@test.local",
                  password_hash="test-only-not-a-real-password-hash",
                  name="Consultor Concorrente",
                  role="SALES",
              )
              sessao.add_all([org, user])
              sessao.flush()
              member = OrganizationMember(
                  organization_id=org.id,
                  user_id=user.id,
                  role=OrganizationRole.OWNER,
                  sales_role=SalesRole.MANAGER,
              )
              sessao.add(member)
              lead = Lead('''
          if old_setup not in text:
              raise SystemExit('Expected fixture setup block not found')
          text = text.replace(old_setup, new_setup, 1)

          old_data = '''    dados = SimpleNamespace(org_id=org.id, lead_id=lead.id, sessao=sessao)'''
          new_data = '''    dados = SimpleNamespace(
                  org_id=org.id,
                  user_id=user.id,
                  lead_id=lead.id,
                  sessao=sessao,
              )'''
          if old_data not in text:
              raise SystemExit('Expected fixture data line not found')
          text = text.replace(old_data, new_data, 1)

          old_cleanup = '''        sessao.query(Lead).filter(Lead.id == lead.id).delete(synchronize_session=False)
                  sessao.query(Organization).filter(
                      Organization.id == org.id,
                  ).delete(synchronize_session=False)'''
          new_cleanup = '''        sessao.query(Lead).filter(Lead.id == lead.id).delete(synchronize_session=False)
                  sessao.query(OrganizationMember).filter(
                      OrganizationMember.organization_id == org.id,
                      OrganizationMember.user_id == user.id,
                  ).delete(synchronize_session=False)
                  sessao.query(User).filter(User.id == user.id).delete(synchronize_session=False)
                  sessao.query(Organization).filter(
                      Organization.id == org.id,
                  ).delete(synchronize_session=False)'''
          if old_cleanup not in text:
              raise SystemExit('Expected fixture cleanup block not found')
          text = text.replace(old_cleanup, new_cleanup, 1)

          text = text.replace(
              'def _app_com_sessoes_reais(fabrica_sessao, org_id, monkeypatch):',
              'def _app_com_sessoes_reais(fabrica_sessao, org_id, user_id, monkeypatch):',
              1,
          )
          text = text.replace('    user_id = uuid.uuid4()\n\n    app = FastAPI()', '    app = FastAPI()', 1)
          text = text.replace(
              '_app_com_sessoes_reais(fabrica_sessao, cenario.org_id, monkeypatch)',
              '_app_com_sessoes_reais(fabrica_sessao, cenario.org_id, cenario.user_id, monkeypatch)',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fixture fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-concurrency-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_conversion_unique_concurrency.py .github/workflows/patch-concurrency-fixture.yml
          git commit -m "test(db): corrige fixture de concorrência com usuário real"
          git push origin HEAD:fix/alphamec-production-ready-completion
