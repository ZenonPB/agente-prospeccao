name: Patch phase1 invite workspace

on:
  push:
    branches:
      - feat/phase-1-foundation-multiworkspace

permissions:
  contents: write

jobs:
  patch-invite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1-foundation-multiworkspace
      - name: Patch invite workspace selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/app/(auth)/aceitar-convite/page.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { resolveSafeCallbackUrl } from '@/lib/safe-redirect';\n"
          import_line = "import { setActiveOrganizationId } from '@/lib/active-organization';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Invite import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          anchor = '''  const invitePath = resolveSafeCallbackUrl(
            `/aceitar-convite?token=${encodeURIComponent(token)}`,
          );
          const loginHref = `/login?callbackUrl=${encodeURIComponent(invitePath)}`;

          if (session) {'''
          replacement = '''  const invitePath = resolveSafeCallbackUrl(
            `/aceitar-convite?token=${encodeURIComponent(token)}`,
          );
          const loginHref = `/login?callbackUrl=${encodeURIComponent(invitePath)}`;

          const handleAcceptExistingAccount = async () => {
            try {
              const accepted = await acceptInvite.mutateAsync(token);
              const organizationId = accepted.organization?.id || invite.organization?.id;
              if (organizationId) setActiveOrganizationId(organizationId);
              setDone({
                orgName: accepted.organization?.name || invite.organization?.name || 'Organização',
                viaRegister: false,
              });
            } catch {
              // O estado de erro da mutation já é renderizado abaixo.
            }
          };

          if (session) {'''
          if anchor not in text:
              raise SystemExit('Invite handler anchor not found')
          text = text.replace(anchor, replacement, 1)

          old_click = 'onClick={() => acceptInvite.mutate(token)}'
          if old_click not in text:
              raise SystemExit('Invite button click not found')
          text = text.replace(old_click, 'onClick={() => void handleAcceptExistingAccount()}', 1)

          old_register = 'await acceptRegister.mutateAsync({ token, name, password });'
          if old_register not in text:
              raise SystemExit('Invite register mutation not found')
          text = text.replace(
              old_register,
              'const accepted = await acceptRegister.mutateAsync({ token, name, password });',
              1,
          )

          old_done = "setDone({ orgName: invite.organization?.name || 'Organização', viaRegister: true });"
          if old_done not in text:
              raise SystemExit('Invite register completion block not found')
          new_done = '''const organizationId = accepted.organization?.id || invite.organization?.id;
              if (organizationId) setActiveOrganizationId(organizationId);
              setDone({
                orgName: accepted.organization?.name || invite.organization?.name || 'Organização',
                viaRegister: true,
              });'''
          text = text.replace(old_done, new_done, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-phase1-invite-workspace.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/'(auth)'/aceitar-convite/page.tsx .github/workflows/patch-phase1-invite-workspace.yml
          git commit -m "fix(invites): seleciona workspace aceito automaticamente"
          git push origin HEAD:feat/phase-1-foundation-multiworkspace
