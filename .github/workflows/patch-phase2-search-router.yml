name: Patch phase2 search router

on:
  push:
    branches:
      - feat/phase-2-company-people-search

permissions:
  contents: write

jobs:
  patch-router:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-2-company-people-search
      - name: Wire search router
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/main.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from src.routes import leads, campaigns, metrics, pipeline, scoring_templates, orgs, analytics, invites, webhooks, tracking, playbooks, notifications, crm, score_feedback, intelligence'
          new_import = old_import + ', search'
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit('router import anchor not found')
              text = text.replace(old_import, new_import, 1)

          anchor = 'app.include_router(intelligence.router, prefix="/api")\n'
          insertion = anchor + 'app.include_router(search.router, prefix="/api")\n'
          if 'app.include_router(search.router, prefix="/api")' not in text:
              if anchor not in text:
                  raise SystemExit('router include anchor not found')
              text = text.replace(anchor, insertion, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-phase2-search-router.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/main.py .github/workflows/patch-phase2-search-router.yml
          git commit -m "feat(api): conecta endpoints de busca avançada"
          git push origin HEAD:feat/phase-2-company-people-search
