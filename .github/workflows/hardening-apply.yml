name: Apply hardening finalization

on:
  push:
    branches: [fix/consolidacao-b4-b6-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consolidacao-b4-b6-hardening
          fetch-depth: 0
      - name: Apply final hardening changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  if new in s:
                      return
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          # Filter Context: apply new dimensions server-side.
          replace(
              "services/api/src/services/analytics_service.py",
              '''    if filters.search:\n        pattern = _like_pattern(filters.search)\n        query = query.filter(or_(\n            Lead.company_name.ilike(pattern, escape="\\\\"),\n            Lead.name.ilike(pattern, escape="\\\\"),\n            Lead.cnpj.ilike(pattern, escape="\\\\"),\n            Lead.normalized_domain.ilike(pattern, escape="\\\\"),\n            Lead.city.ilike(pattern, escape="\\\\"),\n            Lead.state.ilike(pattern, escape="\\\\"),\n            Lead.email.ilike(pattern, escape="\\\\"),\n        ))\n\n''',
              '''    if filters.search:\n        pattern = _like_pattern(filters.search)\n        query = query.filter(or_(\n            Lead.company_name.ilike(pattern, escape="\\\\"),\n            Lead.name.ilike(pattern, escape="\\\\"),\n            Lead.cnpj.ilike(pattern, escape="\\\\"),\n            Lead.normalized_domain.ilike(pattern, escape="\\\\"),\n            Lead.city.ilike(pattern, escape="\\\\"),\n            Lead.state.ilike(pattern, escape="\\\\"),\n            Lead.email.ilike(pattern, escape="\\\\"),\n        ))\n    if filters.segment:\n        pattern = _like_pattern(filters.segment)\n        query = query.filter(or_(\n            Lead.category.ilike(pattern, escape="\\\\"),\n            Lead.segment_opportunity.ilike(pattern, escape="\\\\"),\n        ))\n    if filters.city:\n        query = query.filter(Lead.city.ilike(_like_pattern(filters.city), escape="\\\\"))\n    if filters.state:\n        query = query.filter(func.upper(Lead.state) == filters.state)\n    if filters.negotiation_stage:\n        query = query.filter(Lead.negotiation_stage.in_(\n            [NegotiationStage[item] for item in filters.negotiation_stage]\n        ))\n\n''',
          )

          # Frontend contract/serialization.
          replace(
              "apps/web/src/lib/api.ts",
              'export type CommercialFilterArrayKey = "channel" | "status" | "score_bucket" | "outcome";',
              'export type CommercialFilterArrayKey = "channel" | "status" | "score_bucket" | "outcome" | "negotiation_stage";',
          )
          replace(
              "apps/web/src/lib/api.ts",
              '''  | "attribution"\n  | "search"\n  | "cursor";''',
              '''  | "attribution"\n  | "search"\n  | "segment"\n  | "city"\n  | "state"\n  | "cursor";''',
          )
          replace(
              "apps/web/src/lib/api.ts",
              '''  attribution?: "attributed" | "unattributed";\n  search?: string;\n  cursor?: string;''',
              '''  attribution?: "attributed" | "unattributed";\n  search?: string;\n  segment?: string;\n  city?: string;\n  state?: string;\n  negotiation_stage?: string[];\n  cursor?: string;''',
          )
          replace(
              "apps/web/src/lib/api.ts",
              '''  "attribution",\n  "search",\n  "cursor",''',
              '''  "attribution",\n  "search",\n  "segment",\n  "city",\n  "state",\n  "negotiation_stage",\n  "cursor",''',
          )
          replace(
              "apps/web/src/lib/api.ts",
              '''  upload: (campaignId: string, file: File, idempotencyKey?: string) => {\n    const formData = new FormData();\n    formData.append("file", file);\n    return request<import("@/types").ImportJob>("/api/imports", {\n      method: "POST",\n      params: { campaign_id: campaignId },\n      body: formData,\n      headers: idempotencyKey ? { "Idempotency-Key": idempotencyKey } : undefined,\n    });\n  },''',
              '''  upload: (campaignId: string, file: File) => {\n    const formData = new FormData();\n    formData.append("file", file);\n    return request<import("@/types").ImportJob>("/api/imports", {\n      method: "POST",\n      params: { campaign_id: campaignId },\n      body: formData,\n    });\n  },''',
          )
          replace(
              "apps/web/src/hooks/use-api.ts",
              '''    mutationFn: ({ campaignId, file, idempotencyKey }: { campaignId: string; file: File; idempotencyKey: string }) =>\n      importsApi.upload(campaignId, file, idempotencyKey),''',
              '''    mutationFn: ({ campaignId, file }: { campaignId: string; file: File }) =>\n      importsApi.upload(campaignId, file),''',
          )

          # Historical importer UI maps all commercial fields supported by backend.
          replace(
              "apps/web/src/types/index.ts",
              '''  | "contact_name"\n  | "linkedin"\n  | "instagram";''',
              '''  | "contact_name"\n  | "linkedin"\n  | "instagram"\n  | "status"\n  | "owner_email"\n  | "assigned_at"\n  | "notes"\n  | "next_action_at"\n  | "last_contacted_at"\n  | "negotiation_stage"\n  | "contract_outcome"\n  | "outcome_date"\n  | "post_sale_contacted_at"\n  | "post_sale_channel"\n  | "value"\n  | "expected_close_date"\n  | "lost_reason";''',
          )
          replace(
              "apps/web/src/components/campanhas/csv-import-modal.tsx",
              '''  linkedin: "LinkedIn",\n  instagram: "Instagram",\n};''',
              '''  linkedin: "LinkedIn",\n  instagram: "Instagram",\n  status: "Status histórico",\n  owner_email: "E-mail do responsável",\n  assigned_at: "Data de prospecção/atribuição",\n  notes: "Observações comerciais",\n  next_action_at: "Próxima ação",\n  last_contacted_at: "Último contato",\n  negotiation_stage: "Estágio da negociação",\n  contract_outcome: "Resultado do contrato",\n  outcome_date: "Data do resultado",\n  post_sale_contacted_at: "Contato pós-venda",\n  post_sale_channel: "Canal pós-venda",\n  value: "Valor",\n  expected_close_date: "Previsão de fechamento",\n  lost_reason: "Motivo da perda",\n};''',
          )
          replace(
              "apps/web/src/components/campanhas/csv-import-modal.tsx",
              '''  const uploadKeyRef = useRef<string>(makeIdempotencyKey("historical-import-upload"));\n  const confirmKeyRef = useRef<string>(makeIdempotencyKey("historical-import-confirm"));''',
              '''  const confirmKeyRef = useRef<string>(makeIdempotencyKey("historical-import-confirm"));''',
          )
          replace(
              "apps/web/src/components/campanhas/csv-import-modal.tsx",
              '''    uploadKeyRef.current = makeIdempotencyKey("historical-import-upload");\n    confirmKeyRef.current = makeIdempotencyKey("historical-import-confirm");''',
              '''    confirmKeyRef.current = makeIdempotencyKey("historical-import-confirm");''',
          )
          replace(
              "apps/web/src/components/campanhas/csv-import-modal.tsx",
              '''      const uploaded = await uploadMutation.mutateAsync({ campaignId, file, idempotencyKey: uploadKeyRef.current });''',
              '''      const uploaded = await uploadMutation.mutateAsync({ campaignId, file });''',
          )

          # Regression tests for the new BI dimensions.
          Path("tests/test_analytics_filter_dimensions.py").write_text('''\nfrom sqlalchemy.dialects import postgresql\n\nfrom src.db.models import Lead\nfrom src.services.analytics_filters import CommercialFilterDTO, normalize_commercial_filters\nfrom src.services.analytics_service import apply_commercial_filters\n\n\nclass CapturedQuery:\n    def __init__(self):\n        self.criteria = []\n\n    def filter(self, *criteria):\n        self.criteria.extend(criteria)\n        return self\n\n\ndef test_filter_context_normaliza_dimensoes_comerciais():\n    dto = normalize_commercial_filters({\n        "segment": "  psicologia  ",\n        "city": " Araraquara ",\n        "state": "sp",\n        "negotiation_stage": ["rd", "ORCAMENTO"],\n    })\n    assert dto.segment == "psicologia"\n    assert dto.city == "Araraquara"\n    assert dto.state == "SP"\n    assert dto.negotiation_stage == ["RD", "ORCAMENTO"]\n\n\ndef test_filter_context_aplica_segmento_regiao_e_estagio_no_sql():\n    query = CapturedQuery()\n    dto = CommercialFilterDTO.model_validate({\n        "segment": "psicologia",\n        "city": "Araraquara",\n        "state": "SP",\n        "negotiation_stage": ["RD"],\n    })\n    apply_commercial_filters(query, dto)\n    sql = " ".join(str(item.compile(dialect=postgresql.dialect())) for item in query.criteria)\n    assert "leads.category" in sql\n    assert "leads.segment_opportunity" in sql\n    assert "leads.city" in sql\n    assert "upper(leads.state)" in sql.lower()\n    assert "leads.negotiation_stage" in sql\n'''.lstrip())

          # LIVE docs.
          docs = {
              "docs/00-status-mapa.md": [
                  ("**LIVE · atualizado em 2026-09-13.**", "**LIVE · atualizado em 2026-09-14.**"),
                  ("| Importador histórico AlphaMec | ⬜ | precisa preview/mapping/validation/dedupe/import/report. |", "| Importador histórico AlphaMec | ✅ | lifecycle CSV/XLSX com preview/mapping/dry-run, dedupe conservador, contexto comercial histórico, confirmação idempotente, relatório por linha e E2E PostgreSQL. |"),
                  ("| Filter Context compartilhado | ⬜ | dashboards ainda não usam um contrato único de filtros. |", "| Filter Context compartilhado | ✅ | contrato único URL/API para período, campanha, consultor, oferta/versão, canal, status, score, outcome, atribuição, busca, segmento, cidade/UF e estágio de negociação. |"),
                  ("| BI interativo final | 🟠 | analytics existem; falta Filter Context e UX integrada. |", "| BI interativo final | ✅ | analytics e export usam o mesmo Filter Context; filtros são server-side, restauráveis por URL e cobrem dimensões comerciais principais. |"),
                  ("Importador histórico → Filter Context/BI → coaching/calibração → Golden Path → UAT → campanha real/hardening.", "Coaching/calibração → Golden Path → UAT multi-workspace → campanha real autorizada/hardening final."),
              ],
              "docs/context.md": [
                  ("**LIVE · atualizado em 2026-09-13.**", "**LIVE · atualizado em 2026-09-14.**"),
                  ("B5.1/B5.2 têm filtros server-side e um snapshot comercial compartilhado entre\nas consultas de analytics e a exportação PDF.", "B5.1/B5.2 usam Filter Context server-side e um snapshot comercial compartilhado entre\nas consultas de analytics, a URL e a exportação PDF. O contrato cobre também segmento,\ncidade/UF e estágio de negociação; esses filtros compõem queries no backend."),
              ],
              "docs/roadmap.md": [
                  ("**LIVE · atualizado em 2026-09-13.**", "**LIVE · atualizado em 2026-09-14.**"),
                  ("### 1. Importador histórico AlphaMec", "### 1. Importador histórico AlphaMec — concluído"),
                  ("### 3. Filter Context + BI interativo", "### 3. Filter Context + BI interativo — concluído no escopo RC"),
              ],
              "docs/crm-360-gap-map.md": [
                  ("**LIVE · atualizado em 2026-09-13.**", "**LIVE · atualizado em 2026-09-14.**"),
                  ("e o bulk de leads B6 foi implementado sem encerrar ainda todas as provas de\nprodução PostgreSQL e browser.", "e o bulk de leads B6 possui prova específica de concorrência/idempotência em\nPostgreSQL no CI oficial."),
                  ("- E2E/migration/schema/concorrência/tenant real PostgreSQL para B6;\n", ""),
                  ("B6 ainda não deve ser declarado totalmente concluído: E2E/migration/schema/\nconcorrência/tenant real PostgreSQL, `verify_migrations` contra banco e\nbrowser/a11y/responsive smoke permanecem follow-ups bloqueados pela ausência de\n`E2E_DATABASE_URL`/browser.", "B6 está fechado no escopo técnico do RC: o CI aplica migrations em PostgreSQL real,\nexecuta schema verifier e cobre concorrência/idempotência do bulk em banco real. Smoke\nmanual de browser continua parte do UAT, não uma lacuna de consistência do domínio."),
              ],
          }
          for path, pairs in docs.items():
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  if old in s:
                      s = s.replace(old, new, 1)
              p.write_text(s)

          # Remove the temporary artifact snapshot from regular CI.
          p = Path(".github/workflows/ci.yml")
          s = p.read_text()
          marker = '''      - name: Export hardening source snapshot\n        uses: actions/upload-artifact@v4\n        with:\n          name: hardening-source\n          path: |\n            services/api/src/services/analytics_service.py\n            apps/web/src/lib/api.ts\n            apps/web/src/hooks/use-api.ts\n            apps/web/src/hooks/use-commercial-filters.ts\n            apps/web/src/types/index.ts\n            apps/web/src/components/campanhas/csv-import-modal.tsx\n            apps/web/src/components/relatorios/report-controls.tsx\n            docs/00-status-mapa.md\n            docs/context.md\n            docs/roadmap.md\n            docs/crm-360-gap-map.md\n'''
          if marker in s:
              p.write_text(s.replace(marker, "", 1))

          # Self-delete: one-shot workflow.
          Path(".github/workflows/hardening-apply.yml").unlink()
          PY
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: conclui hardening B4-B6 [hardening-applied]"
          git push origin HEAD:fix/consolidacao-b4-b6-hardening
