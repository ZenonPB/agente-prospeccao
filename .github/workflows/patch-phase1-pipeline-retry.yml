name: Patch phase1 pipeline retry

on:
  push:
    branches:
      - feat/phase-1-foundation-multiworkspace

permissions:
  contents: write

jobs:
  patch-retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1-foundation-multiworkspace
      - name: Restore retry controls after pipeline failures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/campanhas/campaign-pipeline.tsx')
          text = path.read_text(encoding='utf-8')

          first = "setIsRunning(false);\n      const msg = e instanceof Error ? e.message : 'Erro ao iniciar pipeline';"
          first_new = "setIsRunning(false);\n      setHasStarted(false);\n      const msg = e instanceof Error ? e.message : 'Erro ao iniciar pipeline';"
          if first not in text:
              raise SystemExit('Pipeline start catch not found')
          text = text.replace(first, first_new, 1)

          second = "setIsRunning(false);\n      const message = error instanceof Error ? error.message : 'Erro ao descobrir eventos';"
          second_new = "setIsRunning(false);\n      setHasStarted(false);\n      const message = error instanceof Error ? error.message : 'Erro ao descobrir eventos';"
          if second not in text:
              raise SystemExit('Event discovery catch not found')
          text = text.replace(second, second_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-phase1-pipeline-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/campanhas/campaign-pipeline.tsx .github/workflows/patch-phase1-pipeline-retry.yml
          git commit -m "fix(campanhas): restaura retry após falhas do pipeline"
          git push origin HEAD:feat/phase-1-foundation-multiworkspace
