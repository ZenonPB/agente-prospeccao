name: Apply Vertentes scoring semantics

on:
  push:
    branches: [feat/vertentes-offerprofile-consolidation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vertentes-scoring-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoring semantics
        run: python scripts/fix_vertente_scoring_semantics.py
      - name: Validate syntax
        run: python -m compileall -q services/api services/workers
      - name: Commit patch and remove temporary tooling
        run: |
          rm scripts/fix_vertente_scoring_semantics.py
          rm .github/workflows/tmp-vertentes-scoring-semantics.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services scripts .github/workflows
          git commit -m "fix: separa sinais de fit de sinais auxiliares [vertentes-scoring-applied]"
          git push origin HEAD:feat/vertentes-offerprofile-consolidation
