name: Phase56 final patch
on:
  push:
    branches: [feat/phase-5-6-offer-excellence-continuous-agent]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-5-6-offer-excellence-continuous-agent
      - name: Apply final fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('services/workers/src/services/offer_profiles_phase5.py')
          text = p.read_text()
          old = '"people_discovery": {"max_cost": 3, "max_steps": 3, "min_role_fit": 70}'
          new = '"people_discovery": {"max_cost": 3, "max_steps": 2, "min_role_fit": 70}'
          if old not in text:
              raise SystemExit('people discovery anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('services/api/src/services/prospecting_automation_service.py')
          text = p.read_text()
          text = text.replace(
              '{"RESPONDEU", "RESPONDED", "NEGOCIANDO"}',
              '{"RESPONDIDO", "RESPONDEU", "RESPONDED", "NEGOCIANDO"}',
              1,
          )
          p.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/workers/src/services/offer_profiles_phase5.py services/api/src/services/prospecting_automation_service.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(phase56): preserva contratos e status canônico"
          git push
