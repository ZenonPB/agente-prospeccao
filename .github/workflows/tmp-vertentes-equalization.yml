name: Apply Vertentes equalization

on:
  push:
    branches: [feat/vertentes-offerprofile-consolidation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vertentes-equalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply remaining equalization
        run: python scripts/extend_vertente_equalization.py
      - name: Validate syntax
        run: python -m compileall -q services/api services/workers
      - name: Commit patch and remove temporary tooling
        run: |
          rm scripts/extend_vertente_equalization.py
          rm .github/workflows/tmp-vertentes-equalization.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services apps tests scripts .github/workflows
          git commit -m "feat: equaliza catalogo factory e completa navegacao [vertentes-equalized]"
          git push origin HEAD:feat/vertentes-offerprofile-consolidation
