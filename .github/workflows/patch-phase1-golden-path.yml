name: Patch phase1 golden path

on:
  push:
    branches:
      - feat/phase-1-foundation-multiworkspace

permissions:
  contents: write

jobs:
  patch-golden-path:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-1-foundation-multiworkspace
      - name: Patch auto-start idempotency and provider status contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/campanhas/campaign-pipeline.tsx')
          text = path.read_text(encoding='utf-8')
          anchor = '''  const [errorMessage, setErrorMessage] = useState<string | null>(null);
            const logsEndRef = useRef<HTMLDivElement>(null);'''
          replacement = '''  const [errorMessage, setErrorMessage] = useState<string | null>(null);
            const logsEndRef = useRef<HTMLDivElement>(null);
            const autoStartTriggeredRef = useRef(false);'''
          if anchor not in text:
              raise SystemExit('Expected campaign ref anchor not found')
          text = text.replace(anchor, replacement, 1)

          old_effect = '''  useEffect(() => {
              // Auto-start intencional: navegação com ?start=true dispara a coleta uma
              // única vez. Dispara via microtask para não sincronizar estado no effect.
              if (autoStart && !hasStarted && !isRunning) {
                const t = setTimeout(() => handleStart('collect'), 0);
                return () => clearTimeout(t);
              }
              // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [autoStart]);'''
          new_effect = '''  useEffect(() => {
              // `?start=true` é uma intenção one-shot. O ref é marcado dentro do
              // callback (e não antes) para continuar correto no ciclo extra de
              // setup/cleanup do StrictMode em desenvolvimento sem disparar duas jobs.
              if (!autoStart || autoStartTriggeredRef.current) return;

              const timer = window.setTimeout(() => {
                if (autoStartTriggeredRef.current) return;
                autoStartTriggeredRef.current = true;
                void handleStart('collect');
              }, 0);

              return () => window.clearTimeout(timer);
            }, [autoStart, handleStart]);'''
          if old_effect not in text:
              raise SystemExit('Expected auto-start effect not found')
          path.write_text(text.replace(old_effect, new_effect, 1), encoding='utf-8')

          path = Path('apps/web/src/types/index.ts')
          text = path.read_text(encoding='utf-8')
          old = "provider_status?: 'ok' | 'empty' | 'failed' | 'skipped' | null;"
          new = "provider_status?: 'ok' | 'success' | 'empty' | 'failed' | 'disabled' | 'quota_exceeded' | 'skipped' | null;"
          if old not in text:
              raise SystemExit('Expected provider status union not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit Golden Path idempotency
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/campanhas/campaign-pipeline.tsx
          git commit -m "fix(campanhas): torna auto start idempotente"
      - name: Commit provider contract and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-phase1-golden-path.yml
          git add apps/web/src/types/index.ts .github/workflows/patch-phase1-golden-path.yml
          git commit -m "fix(types): alinha estados reais dos providers"
          git push origin HEAD:feat/phase-1-foundation-multiworkspace
