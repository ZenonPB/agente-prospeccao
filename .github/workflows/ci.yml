name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend-unit:
    name: Backend (py_compile + testes unitários)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q services/api services/workers
      - name: Unit tests (sem banco)
        run: python -m pytest tests -q -W error
      - name: Prospecting Intelligence quality gate
        run: python -m pytest tests/test_prospecting_intelligence_block_a.py -q -W error
      - name: Production resilience unit gate
        run: python -m pytest tests/test_block_d_uat_production_campaigns.py -q -W error
      - name: AlphaMec 1.0 provider diagnostics gate
        run: python -m pytest tests/test_provider_diagnostics.py -q -W error

  migrations:
    name: Migrations (alembic upgrade head)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workers deps
        working-directory: services/workers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade head
        working-directory: services/workers
        env: &migration-env
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          PGADMIN_EMAIL: admin@test.local
          PGADMIN_PASSWORD: admin
          GROQ_API_KEY: test
          GOOGLE_API_KEY: test
          SECRETS_ENCRYPTION_KEY: ""
        run: alembic upgrade head
      - name: Alembic upgrade head (idempotente)
        working-directory: services/workers
        env: *migration-env
        run: alembic upgrade head
      - name: Verify schema contract
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: python scripts/verify_migrations.py --database-url "$DATABASE_URL"
      - name: Verify Sales Operating schema contract
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: python scripts/verify_sales_operating_schema.py --database-url "$DATABASE_URL"
      - name: Verify Block D production readiness contract
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: python scripts/verify_block_d_readiness.py --database-url "$DATABASE_URL"
      - name: Seed templates (smoke)
        working-directory: services/workers
        env: *migration-env
        run: python -m src.seeds.scoring_templates
      - name: Backup and restore rehearsal
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          RESTORE_DATABASE_URL: postgresql://test:test@localhost:5432/test_restore
          PGPASSWORD: test
        run: |
          command -v pg_dump
          bash scripts/backup_postgres.sh /tmp/block-d.backup
          createdb -h localhost -U test test_restore
          bash scripts/restore_postgres.sh /tmp/block-d.backup
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM alembic_version;"

  e2e:
    name: E2E critical invariants (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      E2E_DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci-e2e-secret-minimum-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (api + workers)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Apply migrations
        working-directory: services/workers
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          PGADMIN_EMAIL: admin@test.local
          PGADMIN_PASSWORD: admin
          GROQ_API_KEY: test
          GOOGLE_API_KEY: test
          SECRETS_ENCRYPTION_KEY: ""
        run: alembic upgrade head
      - name: Run E2E outreach cycle
        run: python -m pytest tests/e2e_outreach_cycle.py -q -m e2e
      - name: Verify conversion concurrency invariant
        run: python -m pytest tests/test_conversion_unique_concurrency.py -q
      - name: Verify Historical Importer lifecycle, tenant and idempotency
        run: python -m pytest tests/test_historical_import_e2e.py -q -W error
      - name: Verify bulk lead concurrency, locking and optimistic versioning
        run: python -m pytest tests/test_lead_bulk_postgres.py -q -W error
      - name: Verify Opportunity 360 tenant and performance invariants
        run: python -m pytest tests/test_opportunity_360.py -q -W error
      - name: Verify Opportunity 360 command and permission invariants
        run: python -m pytest tests/test_opportunity_commands.py -q -W error
      - name: Verify Company/Person 360 tenant and performance invariants
        run: python -m pytest tests/test_crm_360_entities.py -q -W error
      - name: Verify Event Intelligence and Golden Paths persistence
        run: python -m pytest tests/test_event_outcome_persistence.py -q -W error
      - name: Verify Sales Operating System tenant, queue and saved views
        run: python -m pytest tests/test_sales_operating_system.py -q -W error
      - name: Verify Block B editable CRM, bulk operations and tenant isolation
        run: python -m pytest tests/test_sales_operating_block_b.py -q -W error
      - name: Verify Block C calibration, controlled learning and coaching
        run: python -m pytest tests/test_learning_coaching_block_c.py -q -W error
      - name: Verify Block D multi-workspace, readiness and campaign rehearsal
        run: python -m pytest tests/test_block_d_uat_production_campaigns.py -q -W error
      - name: Verify Brazil Company Registry persistence, ingestion and search
        run: python -m pytest tests/test_registry_postgres.py tests/test_registry_ingestion.py tests/test_registry_search.py tests/test_registry_provider.py tests/test_registry_scope.py tests/test_registry_scope_record.py tests/test_registry_manifest.py tests/test_araraquara_pilot.py tests/test_registry_health.py tests/test_registry_snapshot_activation.py -q -W error
