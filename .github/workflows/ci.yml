name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  backend-unit:
    name: Backend (py_compile + testes unitários)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: |
          python -m compileall -q services/api services/workers
      - name: Unit tests (sem banco)
        run: python -m pytest tests -q

  migrations:
    name: Migrations (alembic upgrade head)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workers deps
        working-directory: services/workers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic upgrade head
        working-directory: services/workers
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          PGADMIN_EMAIL: admin@test.local
          PGADMIN_PASSWORD: admin
          GROQ_API_KEY: test
          GOOGLE_API_KEY: test
          SECRETS_ENCRYPTION_KEY: ""
        run: alembic upgrade head
      - name: Seed templates (smoke)
        working-directory: services/workers
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          PGADMIN_EMAIL: admin@test.local
          PGADMIN_PASSWORD: admin
          GROQ_API_KEY: test
          GOOGLE_API_KEY: test
          SECRETS_ENCRYPTION_KEY: ""
        run: python -m src.seeds.scoring_templates
