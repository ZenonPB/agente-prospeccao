name: Patch phase2 web wiring

on:
  push:
    branches:
      - feat/phase-2-company-people-search

permissions:
  contents: write

jobs:
  patch-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-2-company-people-search
      - name: Export shared request and add search navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('apps/web/src/lib/api.ts')
          text = api.read_text(encoding='utf-8')
          old = 'async function request<T>(endpoint: string, options: RequestOptions = {}): Promise<T> {'
          new = 'export async function request<T>(endpoint: string, options: RequestOptions = {}): Promise<T> {'
          if new not in text:
              if old not in text:
                  raise SystemExit('request export anchor not found')
              text = text.replace(old, new, 1)
          api.write_text(text, encoding='utf-8')

          sidebar = Path('apps/web/src/components/layout/sidebar.tsx')
          text = sidebar.read_text(encoding='utf-8')
          icon_anchor = '  Target,\n  DollarSign,'
          icon_replacement = '  Target,\n  Search as SearchIcon,\n  DollarSign,'
          if 'Search as SearchIcon' not in text:
              if icon_anchor not in text:
                  raise SystemExit('sidebar icon anchor not found')
              text = text.replace(icon_anchor, icon_replacement, 1)
          nav_anchor = "      { name: 'Campanhas', href: '/campanhas', icon: Megaphone },\n"
          nav_line = nav_anchor + "      { name: 'Buscar', href: '/buscar', icon: SearchIcon },\n"
          if "href: '/buscar'" not in text:
              if nav_anchor not in text:
                  raise SystemExit('sidebar nav anchor not found')
              text = text.replace(nav_anchor, nav_line, 1)
          sidebar.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-phase2-web-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/api.ts apps/web/src/components/layout/sidebar.tsx .github/workflows/patch-phase2-web-wiring.yml
          git commit -m "feat(web): integra busca ao shell multi-workspace"
          git push origin HEAD:feat/phase-2-company-people-search
