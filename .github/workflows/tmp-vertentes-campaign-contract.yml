name: Apply Vertentes campaign contract

on:
  push:
    branches: [feat/vertentes-offerprofile-consolidation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vertentes-campaign-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply campaign contract patch
        run: python scripts/apply_vertentes_campaign_contract.py
      - name: Compile changed Python
        run: python -m compileall -q services/api services/workers
      - name: Commit patch and remove temporary tooling
        run: |
          rm scripts/apply_vertentes_campaign_contract.py
          rm .github/workflows/tmp-vertentes-campaign-contract.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/src/routes/campaigns.py scripts .github/workflows
          git commit -m "fix: vincula campanhas à Vertente efetiva [vertentes-campaign-applied]"
          git push origin HEAD:feat/vertentes-offerprofile-consolidation
