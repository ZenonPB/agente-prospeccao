name: Apply scoring policy fix

on:
  push:
    branches: [fix/scoring-policy-contract]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[scoring-policy-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/apply_scoring_policy_contract_fix.py
      - name: Instalar dependências de teste
        run: python -m pip install -q -r requirements-dev.txt
      - name: Validar compilação
        run: python -m compileall -q services/api services/workers
      - name: Rodar regressões focadas
        run: python -m pytest tests/test_offer_signal_contract.py tests/test_scoring_policy_runtime.py -q
      - name: Rodar suíte completa
        run: python -m pytest tests -q
      - name: Consolidar commit testado
        run: |
          rm scripts/apply_scoring_policy_contract_fix.py
          rm .github/workflows/tmp-scoring-policy-fix.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services tests scripts .github/workflows
          git commit -m "fix: estabiliza política de scoring e isolamento por lead [scoring-policy-applied]"
          git push origin HEAD:fix/scoring-policy-contract
