[pytest]
markers =
    e2e: end-to-end contra banco real (exige E2E_DATABASE_URL)
# Política de warnings: falhas de deprecação são erros, exceto os avisos
# upstream conhecidos e delimitados por mensagem/módulo. Remover estes filtros
# quando slowapi/Starlette corrigirem as APIs obsoletas.
addopts = -W "error::DeprecationWarning"
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:asyncio.coroutines
    ignore::starlette.exceptions.StarletteDeprecationWarning:starlette.testclient
